<style>
/* Layout: app de una columna para el celular. Barra superior fija con volver, contenido, barra de pestañas abajo con el botón «Acelerado» al centro. */
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --surface2:#E3ECEB; --ink:#1A2929; --muted:#586B6A; --line:#D2DDDC;
  --accent:#2A6A6F; --accent-ink:#FFFFFF; --accent-soft:#D9E9E8;
  --pulse:#B9573A; --pulse-soft:#F6E3DC;
  --ok:#2A7048; --ok-soft:#DCEFE3; --warn:#94620F; --warn-soft:#F5E9CF; --bad:#9C3434; --bad-soft:#F4DEDE;
  --ui:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --navh:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101617; --surface:#182122; --surface2:#1F2B2C; --ink:#E1EAEA; --muted:#97A9A9; --line:#2A3637;
  --accent:#84C2C6; --accent-ink:#0E1A1B; --accent-soft:#1D3133;
  --pulse:#E99478; --pulse-soft:#3A2620;
  --ok:#84D0A0; --ok-soft:#1A3124; --warn:#E5BB6A; --warn-soft:#352B18; --bad:#EA9C9C; --bad-soft:#3A2222; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101617; --surface:#182122; --surface2:#1F2B2C; --ink:#E1EAEA; --muted:#97A9A9; --line:#2A3637;
  --accent:#84C2C6; --accent-ink:#0E1A1B; --accent-soft:#1D3133;
  --pulse:#E99478; --pulse-soft:#3A2620;
  --ok:#84D0A0; --ok-soft:#1A3124; --warn:#E5BB6A; --warn-soft:#352B18; --bad:#EA9C9C; --bad-soft:#3A2222; color-scheme:dark }
html{ -webkit-text-size-adjust:100% }
body{ background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:16px; line-height:1.5; margin:0 }
*{ box-sizing:border-box }
button, input, textarea, select{ font:inherit; color:inherit }
a{ color:var(--accent) }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px }
h1,h2,h3{ margin:0; line-height:1.2; text-wrap:balance }
p{ margin:0 }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg) }
.topbar-in{ max-width:36rem; margin:0 auto; height:52px; display:flex; align-items:center; gap:.5rem }
.topbar h1{ font-size:1.12rem; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.back{ border:0; background:none; padding:6px 8px 6px 0; font-size:1rem; color:var(--accent); cursor:pointer; font-weight:600 }
main{ padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:16px calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px)) }
.page{ max-width:36rem; margin:0 auto; display:flex; flex-direction:column; gap:1rem }
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px) }
.nav-in{ max-width:36rem; margin:0 auto; height:var(--navh); display:grid; grid-template-columns:repeat(5,1fr); align-items:center }
.nav a{ text-decoration:none; color:var(--muted); font-size:.72rem; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0 }
.nav a svg{ width:22px; height:22px }
.nav a.on{ color:var(--accent) }
.nav a.sos{ color:var(--pulse) }
.nav a.sos span.dot{ width:46px; height:46px; border-radius:50%; background:var(--pulse); color:#fff; display:grid; place-items:center; margin-top:-18px; box-shadow:0 2px 8px rgba(0,0,0,.18) }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:.7rem; min-width:0 }
.card.soft{ background:var(--accent-soft); border-color:transparent }
.card.warm{ background:var(--pulse-soft); border-color:transparent }
.eyebrow{ font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600 }
.h2{ font-size:1.25rem; font-weight:700 }
.h3{ font-size:1.02rem; font-weight:600 }
.muted{ color:var(--muted) }
.small{ font-size:.88rem }
.row{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center }
.grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.6rem }
.btn{ border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 14px; font-weight:600; cursor:pointer; text-align:center; text-decoration:none; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; gap:.4rem; min-height:44px }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
.btn.sos{ background:var(--pulse); border-color:var(--pulse); color:#fff }
.btn.ghost{ background:transparent }
.btn.block{ width:100% }
.btn.big{ padding:16px; font-size:1.05rem; border-radius:14px }
.btn.sel{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent) }
.btn:disabled{ opacity:.5 }
.tile{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; text-decoration:none; color:var(--ink); display:flex; flex-direction:column; gap:.25rem; min-height:92px }
.tile b{ font-size:1rem }
.tile span{ font-size:.82rem; color:var(--muted); line-height:1.35 }
.chip{ display:inline-block; font-size:.72rem; font-weight:600; padding:.15rem .55rem; border-radius:999px; background:var(--surface2); color:var(--muted) }
.chip.ok{ background:var(--ok-soft); color:var(--ok) } .chip.warn{ background:var(--warn-soft); color:var(--warn) } .chip.bad{ background:var(--bad-soft); color:var(--bad) } .chip.acc{ background:var(--accent-soft); color:var(--accent) }
.list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.5rem }
.list li{ min-width:0 }
ul.dots{ margin:0; padding-left:1.15rem; display:flex; flex-direction:column; gap:.3rem }
.read{ font-family:var(--read); font-size:1.06rem; line-height:1.62; display:flex; flex-direction:column; gap:.85rem }
.read strong{ font-weight:600 }
label{ display:flex; flex-direction:column; gap:.3rem; font-size:.9rem; font-weight:600 }
label .hint{ font-weight:400; color:var(--muted); font-size:.82rem }
input[type=text], input[type=number], input[type=date], input[type=time], textarea, select{ border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 12px; font-weight:400; width:100%; min-width:0 }
textarea{ min-height:76px; resize:vertical }
input[type=range]{ width:100%; accent-color:var(--accent) }
.scale{ display:grid; grid-template-columns:repeat(11,1fr); gap:3px }
.scale button{ border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 0; font-size:.85rem; font-variant-numeric:tabular-nums; cursor:pointer }
.scale button.sel{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent) }
.opts{ display:flex; flex-direction:column; gap:.4rem }
.opts button{ text-align:left; justify-content:flex-start }
.form{ display:flex; flex-direction:column; gap:.8rem }
.item{ border-top:1px solid var(--line); padding-top:.7rem; display:flex; flex-direction:column; gap:.35rem }
.item:first-child{ border-top:0; padding-top:0 }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:.15rem .7rem; font-size:.9rem }
.kv dt{ color:var(--muted) } .kv dd{ margin:0; min-width:0; overflow-wrap:anywhere }
details.acc{ background:var(--surface); border:1px solid var(--line); border-radius:14px }
details.acc > summary{ list-style:none; cursor:pointer; padding:14px 16px; font-weight:600; display:flex; justify-content:space-between; gap:.5rem }
details.acc > summary::-webkit-details-marker{ display:none }
details.acc > summary::after{ content:"+"; color:var(--muted) }
details.acc[open] > summary::after{ content:"–" }
details.acc > div{ padding:0 16px 16px; display:flex; flex-direction:column; gap:.7rem }
.bar{ height:8px; background:var(--surface2); border-radius:99px; overflow:hidden }
.bar > i{ display:block; height:100%; background:var(--accent); border-radius:99px }
.stat{ font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1 }
.tnum{ font-variant-numeric:tabular-nums }
.chart{ width:100%; height:auto; display:block }
.chart text{ fill:var(--muted); font-size:10px; font-family:var(--ui) }
.chart .ln{ stroke:var(--accent); stroke-width:2.2; fill:none }
.chart .ar{ fill:var(--accent); opacity:.12 }
.chart .gd{ stroke:var(--line); stroke-width:1 }
.chart .rf{ stroke:var(--warn); stroke-width:1; stroke-dasharray:3 3 }
.chart .pt{ fill:var(--accent) }
.fig{ width:96px; height:96px; flex:0 0 auto; color:var(--ink) }
.fig .band{ stroke:var(--pulse); stroke-dasharray:4 4 }
.fig .arrow{ stroke:var(--accent) }
.ex{ display:flex; gap:.8rem; align-items:flex-start }
.ex > div{ min-width:0; display:flex; flex-direction:column; gap:.25rem }
.phone{ font-weight:700; font-size:1.08rem; user-select:all; font-variant-numeric:tabular-nums }
.banner{ background:var(--warn-soft); color:var(--warn); border-radius:12px; padding:10px 12px; font-size:.88rem }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; font-weight:600; font-size:.9rem; z-index:60; max-width:calc(100% - 32px); text-align:center }
.tbl{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface) }
.tbl table{ border-collapse:collapse; width:100%; font-size:.86rem; min-width:30rem }
.tbl th, .tbl td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top }
.tbl th{ font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted) }
[hidden]{ display:none !important }
/* Reproductor de sesiones guiadas */
.player{ position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px, env(safe-area-inset-left,0px)) }
.player-in{ max-width:32rem; width:100%; margin:0 auto; flex:1; display:flex; flex-direction:column; gap:1rem; min-height:0 }
.p-top{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; flex-wrap:wrap }
.btn.small{ padding:6px 10px; min-height:36px; font-size:.88rem; border-radius:10px }
.step .stephead{ display:flex; gap:.6rem; align-items:center }
.num{ width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-weight:700; font-size:.9rem; flex:0 0 auto }
.step.ok .num{ background:var(--ok); color:var(--surface) }
.step.ok{ border-color:var(--ok-soft) }
.sub{ border-top:1px dashed var(--line); padding-top:.6rem; display:flex; flex-direction:column; gap:.45rem }
.bars7{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; height:64px }
.bars7 div{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:2px; font-size:.66rem; color:var(--muted); min-height:0 }
.bars7 i{ display:block; width:100%; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px }
details.plain > summary{ cursor:pointer; color:var(--accent); font-weight:600 }
.p-stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.2rem; text-align:center; min-height:0 }
.p-title{ font-size:1.5rem; font-weight:700 }
.p-text{ font-family:var(--read); font-size:1.18rem; line-height:1.5; max-width:28rem }
.p-time{ font-size:.95rem; color:var(--muted); font-variant-numeric:tabular-nums }
.orb-wrap{ width:min(62vw,240px); aspect-ratio:1; max-width:100%; display:grid; place-items:center; position:relative }
.orb{ width:100%; height:100%; border-radius:50%; background:radial-gradient(circle at 40% 35%, var(--accent-soft), var(--accent)); transform:scale(.55); opacity:.9 }
.orb-label{ position:absolute; inset:0; display:grid; place-items:center; font-weight:700; font-size:1.2rem; color:var(--ink) }
.p-progress{ height:6px; background:var(--surface2); border-radius:99px; overflow:hidden }
.p-progress i{ display:block; height:100%; background:var(--accent); width:0 }
.p-ctrl{ display:grid; grid-template-columns:1fr 1fr; gap:.6rem }
@media (prefers-reduced-motion:reduce){ .orb{ transition:none !important } }
@media (min-width:560px){ .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem } }
</style>

<header class="topbar"><div class="topbar-in">
  <button class="back" id="backBtn" data-act="back" hidden aria-label="Volver">‹ Volver</button>
  <h1 id="title">Calma</h1>
</div></header>
<main id="app"><div class="page"><div class="card"><p class="h2">Calma</p><p class="muted">Tu práctica diaria para bajar la alarma: respirar, soltar la mandíbula y el cuello, entender tu cabeza y animarte de a poco.</p></div></div></main>
<nav class="nav" aria-label="Secciones"><div class="nav-in" id="nav"></div></nav>
<div id="player" class="player" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
/* ---------- estado ---------- */
var KEY = 'calma.v1';
var canStore = true;
var state = null;
function blank(){ return { v:1, start:null, week:null, settings:{ guia:'voz', fondo:'lluvia', volFondo:.5, palabra:'soltá' }, profile:null,
  read:{}, practice:[], checks:[], tension:[], headaches:[], thoughts:[], worries:[], problems:[], circles:null, ladder:null,
  experiments:[], scales:[], sens:[], alarms:null, relapse:'', uncert:[],
  water:{}, waterGoal:8, meals:{}, acts:[], moves:[], moveGoal:3, tasks:[], bills:[], paid:{}, meds:[], medNames:[], mornings:{}, nights:{} }; }
function load(){
  try{ var raw = localStorage.getItem(KEY); state = raw ? JSON.parse(raw) : blank(); }
  catch(e){ canStore = false; state = blank(); }
  migrate();
}
var AREAS = [['mandibula','Mandíbula apretada o bruxismo'],['cuello','Cuello y hombros tensos'],['cabeza','Dolores de cabeza'],['social','Ansiedad con gente (ansiedad social)'],['transpirar','Miedo a transpirar o a ponerte colorado']];
function allAreas(){ var a = {}; AREAS.forEach(function(x){ a[x[0]] = true; }); return a; }
function migrate(){
  var st = state.settings || (state.settings = {});
  if(!('guia' in st)) st.guia = st.voz === false ? (st.sonido ? 'tonos' : 'nada') : 'voz';
  var b = blank(); for(var k in b){ if(!(k in state)) state[k] = b[k]; }
  for(var s in b.settings){ if(!(s in st)) st[s] = b.settings[s]; }
  if(state.start && !state.profile) state.profile = { name:'', areas:allAreas() };
  if(state.start){ if(!state.circles) state.circles = seedCircles(); if(!state.ladder) state.ladder = seedLadder(); }
}
function has(a){ return !state.profile || !state.profile.areas || state.profile.areas[a] !== false; }
function hasAny(list){ return list.some(has); }
var LESSON_AREA = { l4:['mandibula','cuello','cabeza'], l5:['transpirar'], l9:['mandibula'], l10:['cuello'], l11:['cabeza'], l17:['social'], l18:['social'], l19:['social'] };
function lessonOn(id){ return !LESSON_AREA[id] || hasAny(LESSON_AREA[id]); }
function wl(w){ return w.lessons.filter(lessonOn); }
function wt(w){
  if(w.n === 3){ var p = []; if(has('mandibula')) p.push('mandíbula'); if(has('cuello')) p.push('cuello'); if(has('cabeza')) p.push('dolor de cabeza');
    if(!p.length) return 'El cuerpo y la tensión'; var t = p.length > 1 ? p.slice(0, -1).join(', ') + ' y ' + p[p.length - 1] : p[0]; return t.charAt(0).toUpperCase() + t.slice(1); }
  if(w.n === 6 && !has('social')) return 'Animarte de a poco';
  return w.title;
}
function wx(w){
  if(w.n === 3){ var p = []; if(has('mandibula')) p.push('las alarmas de mandíbula'); if(has('cuello')) p.push('2 minutos de cuello'); return p.length ? 'Y sumá ' + p.join(' y ') + '.' : 'Y una relajación rápida cada vez que notes tensión.'; }
  if(w.n === 6 && !has('social')) return 'Hacela muchas veces en el día.';
  if(w.n === 7 && !has('social')) return 'Y ejercicios de sensaciones.';
  return w.extra;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); canStore = true; }catch(e){ canStore = false; } }

/* ---------- utilidades ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function now(){ return new Date().toISOString(); }
function ymd(d){ d = d ? new Date(d) : new Date(); var m = d.getMonth()+1, dd = d.getDate(); return d.getFullYear() + '-' + (m<10?'0':'') + m + '-' + (dd<10?'0':'') + dd; }
function daysBetween(a, b){ var A = new Date(a + 'T00:00:00'), B = new Date(b + 'T00:00:00'); return Math.round((B - A) / 86400000); }
function fmtDate(iso){ var d = new Date(iso); return d.toLocaleDateString('es-AR', { day:'numeric', month:'short' }); }
function fmtDT(iso){ var d = new Date(iso); return d.toLocaleDateString('es-AR', { day:'numeric', month:'short' }) + ' ' + d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' }); }
function weekStart(d){ d = new Date(d); var day = (d.getDay() + 6) % 7; d.setHours(0,0,0,0); d.setDate(d.getDate() - day); return ymd(d); }
function lastDays(arr, n, field){ var lim = Date.now() - n * 86400000; return arr.filter(function(x){ return new Date(x[field||'t']).getTime() >= lim; }); }
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 2200); }
function fd(form){ var o = {}; Array.prototype.forEach.call(form.elements, function(el){ if(!el.name) return; if(el.type === 'checkbox'){ o[el.name] = el.checked; } else if(el.type === 'radio'){ if(el.checked) o[el.name] = el.value; } else o[el.name] = el.value.trim(); }); return o; }
function num(v){ var n = parseFloat(v); return isNaN(n) ? null : n; }

/* ---------- contenido: lecciones ---------- */
var L = {};
function lesson(id, week, title, mins, paras, proba, ir, irLabel){ L[id] = { id:id, week:week, title:title, mins:mins, paras:paras, proba:proba, ir:ir, irLabel:irLabel }; }
lesson('l1',1,'La alarma',2,[
 'Tu cerebro tiene un sistema de alarma que vigila todo el tiempo si hay peligro. Es rápido y no piensa mucho: reacciona parecido ante un auto que se te viene encima que ante un mail del jefe, una reunión o un pensamiento como «¿y si sale mal?».',
 'Cuando se prende, el cuerpo se prepara para pelear o escapar: sube el pulso, se acelera la respiración, se tensan la mandíbula, el cuello y los hombros, y transpirás para enfriarte. Todo eso es normal y útil. No hay nada roto.',
 'El problema aparece cuando la alarma es muy sensible y se prende muchas veces por día, o cuando se prende y <strong>no se apaga</strong> aunque el peligro ya pasó. Ahí el cuerpo vive en guardia: mandíbula apretada, cuello duro, cabeza que no para, dolor de cabeza.',
 'La buena noticia es que la sensibilidad de la alarma se puede bajar. No a la fuerza, sino entrenando. De eso se trata esta app.'
],'Tres veces hoy, cuando notes que algo te tensa, fijate qué hace tu cuerpo: ¿mandíbula, hombros, respiración, transpiración? Solo notarlo, sin cambiar nada.');
lesson('l2',1,'Por qué no se apaga',3,[
 'Hay cuatro cosas que mantienen la alarma prendida cuando el problema ya pasó:',
 '<strong>Preocuparte y darle vueltas.</strong> El cuerpo responde a lo que pensás como si estuviera pasando. En decenas de estudios, preocuparse subió la presión y el pulso.',
 '<strong>Vigilar.</strong> La cabeza ansiosa busca amenazas sin darse cuenta, y siempre encuentra alguna.',
 '<strong>Evitar y usar muletas.</strong> Si evitás algo, o entrás «protegido», el cerebro nunca aprende que no era tan peligroso.',
 '<strong>Leer las sensaciones como peligro.</strong> El pulso, el calor o la transpiración se vuelven una amenaza más.',
 'Se arma un círculo: algo te alarma, el cuerpo se activa, la preocupación y las muletas lo sostienen, y las sensaciones se leen como más peligro. Vuelta a empezar. Todo lo que vas a practicar corta ese círculo por algún lado: el cuerpo, los pensamientos o lo que hacés.'
],'Armá tu primer círculo con una situación de esta semana. Hay dos de ejemplo para guiarte.','circulo','Ir a Mi círculo');
lesson('l3',1,'Por qué no se controla a la fuerza',3,[
 'Probá esto: durante un minuto, no pienses en un oso blanco. Seguramente apareció varias veces. Intentar no pensar algo lo trae de vuelta con más fuerza; está muy estudiado.',
 'Con la ansiedad pasa lo mismo. Decirte «calmate», «no te pongas nervioso» o «que no se note» es otra forma de vigilar, y la alarma lo lee como «hay peligro». Es como querer dormirte a la fuerza: cuanto más lo intentás, menos sale.',
 'Lo que sí manejás es otra cosa: <strong>qué hacés con lo que sentís</strong>, cuánto practicás cuando estás tranquilo y cómo cuidás la base (sueño, comida, café, movimiento).',
 'La relajación se entrena como un músculo: primero 15 minutos en calma, en unas semanas 20 segundos en medio del día. Los pensamientos no se borran: se aprende a no engancharse. Con práctica constante, los cambios se notan en 4 a 8 semanas.'
],'Hacé el experimento del oso blanco un minuto. Después, otro minuto dejando que aparezca lo que aparezca. Compará cuál fue más tranquilo.');
lesson('l4',1,'Mandíbula, cuello y dolor de cabeza',3,[
 'Cuando la alarma se prende, uno de los primeros lugares donde se nota es la mandíbula. Apretar los dientes activa también los músculos del cuello. Si eso pasa muchas veces por día, durante horas frente a la compu, el cuello y la cabeza terminan doliendo.',
 'Y se arma otro círculo: el dolor preocupa, la preocupación tensa, la tensión duele más.',
 'Algunas migrañas aparecen justo cuando aflojás (el fin de semana, después de una semana dura). No es que relajarte haga mal: es la bajada brusca. Por eso sirve más una práctica diaria y pareja que aguantar y después soltar.',
 'Para prevenir sin remedios, lo que tiene evidencia es: relajación y manejo del estrés (las guías de neurología los recomiendan), ejercicio aeróbico, sueño y comidas regulares, café parejo y no tarde, soltar la mandíbula durante el día y fortalecer el cuello (en oficinistas, 2 minutos por día bajaron 43 % los días con dolor de cabeza).',
 'Sobre los remedios: está bien tomarlos cuando hace falta. Pero si se usan 10 días o más por mes, el remedio mismo puede dar más dolor. Llevá la cuenta en la sección de dolor de cabeza, y si los dolores son frecuentes, consultá a un neurólogo: hay formas de prevenirlos.'
],'Anotá el próximo dolor de cabeza en el diario, con lo que venía pasando antes.','dolor','Ir a Dolor de cabeza');
lesson('l5',1,'El miedo al miedo: la transpiración',3,[
 'Transpirar con calor, con gente o con nervios es normal: es la forma del cuerpo de enfriarse cuando se activa. El problema empieza cuando la transpiración se vuelve una amenaza en sí: «se me va a notar», «van a pensar que estoy nervioso».',
 'Ahí se arma el círculo más tramposo: el miedo a transpirar prende la alarma, la alarma hace transpirar más, y como estás pendiente de tu cuerpo, lo notás todo el tiempo. El miedo a la sensación termina siendo peor que la sensación.',
 'Lo que lo mantiene suelen ser muletas: ropa oscura o abrigo para tapar, brazos pegados al cuerpo, evitar dar la mano, secarte todo el tiempo, irte antes, mirarte en cada vidrio. Alivian un rato, pero no te dejan descubrir que no era tan grave.',
 'Un dato que ayuda: en un estudio, personas con mucho miedo a ponerse rojas no se ponían más rojas que otras cuando se lo midió; solo creían que sí. Lo que se siente fuerte desde adentro se ve mucho menos desde afuera.',
 'Lo que funciona: poner la atención afuera (en la gente y la charla, no en tu cuerpo), soltar las muletas de a poco, hacer experimentos donde la transpiración puede notarse, y provocar calor y pulso a propósito para dejar de temerles. Todo eso está en la app.',
 'Si transpirás mucho incluso sin nervios ni calor (por ejemplo, manos que gotean), consultalo con un dermatólogo: tiene tratamiento.'
],'Abrí el círculo de ejemplo de la transpiración y cambialo con tus muletas reales.','circulo','Ir a Mi círculo');
lesson('l25',1,'Ordenar para no cargar la cabeza',2,[
 'Una parte de la ansiedad es carga: cosas pendientes dando vueltas. La cabeza vuelve una y otra vez a lo que quedó abierto (un pago, un turno, un llamado) para no olvidarlo. Es como una alarma chiquita que suena cada tanto.',
 'Un estudio lo mostró: con una tarea pendiente, la gente tenía más pensamientos que se le metían en la cabeza; pero alcanzaba con escribir un plan concreto (qué y cuándo) para que esos pensamientos bajaran, aunque la tarea siguiera sin hacer.',
 'Por eso sirve sacarlo de la cabeza: anotar pagos, vencimientos y pendientes en un lugar fijo y mirarlo una vez por día. La cabeza deja de hacer de agenda.',
 'La base también importa: comer a horario, tomar agua y moverte bajan la activación del cuerpo y los dolores de cabeza. No hace falta hacerlo perfecto: alcanza con ir sumando de a poco.'
],'Sacá de la cabeza todo lo pendiente en Organizar y ponele fecha a lo que la tiene.','organizar','Ir a Organizar');
lesson('l6',2,'Respirar lento y suave',2,[
 'De todo lo que se vende para «calmar el sistema nervioso», lo que mejor evidencia tiene es respirar lento: unas 6 respiraciones por minuto, por la nariz, con la panza. Aumenta el «freno» del corazón y, practicado unas semanas, baja el estrés y la ansiedad. Es un efecto chico a moderado, pero real.',
 'El error más común es respirar profundo y grande. Eso hace hiperventilar: aparecen mareo, hormigueo y palpitaciones, que se parecen a la ansiedad. La consigna es <strong>lento y suave</strong>, casi como si no movieras el aire.',
 'Se aprende en calma, como un simulacro. Con 5 minutos por día alcanza para empezar (los estudios usan de 5 a 20); cuando te salga fácil, podés subir a 10. Lo que más importa es hacerlo todos los días, no cuánto dura. Si la practicás solo cuando estás en 9 de 10, no va a salir.',
 'Y algo importante: la respiración es para estar mejor, no un escudo para que «no pase» algo. Si la usás para que no se note el miedo, se vuelve una muleta.'
],'5 minutos de respiración lenta hoy.','respirar','Ir a Respirar');
lesson('l7',2,'Relajación progresiva',3,[
 'La relajación progresiva consiste en tensar un grupo de músculos unos segundos, soltar de golpe y prestar atención a la diferencia. El objetivo no es aflojarse y listo: es aprender a <strong>notar la tensión antes</strong>, cuando todavía es chica. Para la mandíbula y los hombros es clave, porque ahí la tensión suele ser invisible.',
 'Se avanza por etapas: 16 grupos de músculos, después 7, después 4, después soltar sin tensar, y al final una versión de 20 segundos para usar en medio del día. Cada etapa se pasa cuando la anterior sale bien.',
 'Tips: tensá con la mitad de la fuerza (en mandíbula y cuello, todavía menos); soltá de golpe; la fase de soltar es mucho más larga que la de tensar; practicá sentado y despierto, no solo en la cama.',
 'Para la ansiedad generalizada, la versión completa (la relajación aplicada) tiene tanta evidencia como la terapia cognitiva.'
],'Hacé la etapa de 16 grupos hoy.','relajar','Ir a Relajar');
lesson('l8',2,'Si relajarte te pone nervioso',2,[
 'A bastante gente ansiosa le pasa: intenta relajarse y se pone peor. Aparece inquietud, sensaciones raras (pesadez, hormigueo, el corazón más lento) o miedo a perder el control. En un estudio le pasó a 3 de cada 10 personas con relajación progresiva.',
 'No es peligroso. Suele venir de que el cuerpo afloja y la cabeza lo lee como «bajar la guardia».',
 'Qué hacer: ojos abiertos y sentado; sesiones más cortas (3 a 5 minutos) que vas alargando; preferir ejercicios con algo que hacer antes que «dejar la mente en blanco»; y recordar que vos manejás el ejercicio y podés parar. Tolerar esas sensaciones sin escapar también es práctica: les baja el miedo.'
],'Si te pasa, probá la versión de 4 grupos con los ojos abiertos.');
lesson('l26',2,'Lo bueno también cuenta',2,[
 'La cabeza ansiosa mira lo malo con lupa y deja pasar lo bueno. Es parte de la alarma: está hecha para buscar amenazas.',
 'Anotar tres cosas buenas del día entrena a mirar también lo otro. La evidencia es modesta (los efectos son chicos), pero cuesta dos minutos y a mucha gente le cambia el cierre del día.',
 'El repaso de la noche tiene dos partes. Lo que salió, aunque sea chico. Y lo que no salió, sin castigarte: tratarte con la misma comprensión que a un amigo se asocia con menos ansiedad. Retarte no te hace más responsable; te pone más en alerta.',
 'Pero tampoco es dejarlo pasar: lo que no salió se convierte en un paso chico y concreto para mañana. Comprensión con vos y compromiso con lo que querés hacer.'
],'Esta noche, cerrá el día en la app.','noche','Cerrar el día');
lesson('l9',3,'Labios juntos, dientes separados',3,[
 'La mandíbula en reposo está así: labios suavemente juntos, dientes separados unos milímetros y la punta de la lengua apoyada detrás de los dientes de arriba. Los dientes solo deberían tocarse al masticar y tragar.',
 'De día, lo más común no es apretar fuerte: es dejar los dientes tocándose o la mandíbula tensa durante muchos ratos, sin darte cuenta. Por eso sirve algo que te interrumpa: ¿cómo está mi mandíbula ahora?',
 'La idea: 8 a 10 alarmas por día, en horarios que varíen, durante 4 semanas. Cada vez chequeás, lo anotás en un toque y volvés a la posición de reposo. Después alcanza con pegatinas y con chequear al cambiar de tarea.',
 'Un hábito simple tarda en promedio unos 66 días en volverse automático, y saltear un día no arruina nada. No esperes llegar a cero: incluso gente sin dolor tiene la mandíbula tensa en uno de cada cuatro chequeos. No te retes cuando te encuentres apretando: detectarlo es el ejercicio.'
],'Configurá las alarmas de hoy en el reloj del celular.','mandibula','Ir a Mandíbula');
lesson('l10',3,'El músculo que duele necesita carga',3,[
 'Las «contracturas» de cuello y hombros casi nunca son un nudo que hay que romper. Son músculos sensibles y poco entrenados. Lo que más evidencia tiene es fortalecerlos.',
 'En un ensayo con oficinistas, un solo ejercicio con banda elástica, 2 minutos por día, 5 días por semana, bajó el dolor de cuello casi lo mismo que 12 minutos, y también los días con dolor de cabeza. Los cambios aparecen a partir de las 6 a 10 semanas.',
 'La postura perfecta no existe: la relación entre cómo te sentás y el dolor es débil. Lo que importa es no quedarte quieto mucho rato. La mejor postura es la próxima: una pausa de 1 o 2 minutos cada 45 a 60 minutos de pantalla.',
 'Regla del dolor: una molestia de hasta 3 o 4 de 10 que se va al terminar está bien. Si sube más, o al día siguiente estás peor, bajá la carga. Pará y consultá si aparece hormigueo, mareo o dolor que baja por el brazo.'
],'Hacé los 2 minutos de cuello hoy.','cuello','Ir a Cuello');
lesson('l11',3,'Dolor de cabeza: qué lo dispara',3,[
 'Los disparadores más comunes son: dormir poco o a deshoras, saltear comidas, tomar poca agua, mucho café o cortarlo de golpe, alcohol, estrés y la bajada después del estrés, y muchas horas de pantalla con la mandíbula y el cuello tensos.',
 'No se puede adivinar cuál es el tuyo: hay que anotarlo. El diario toma 30 segundos y en un mes muestra patrones.',
 'Cuando empieza: lugar oscuro y en silencio, frío en la frente o calor en la nuca, agua, algo de comer si no comiste, soltar la mandíbula y respirar lento 5 minutos. Si en una o dos horas sigue igual, tomar tu remedio está bien.',
 '<strong>A la guardia ya</strong> si es el peor dolor de tu vida y empezó de golpe, si viene con fiebre y la nuca dura, o con dificultad para hablar, para ver, o debilidad de un lado.'
],'Anotá en el diario los últimos dolores que recuerdes.','dolor','Ir a Dolor de cabeza');
lesson('l12',4,'Los pensamientos no son hechos',3,[
 'Entre lo que pasa y lo que sentís hay un paso que casi no se ve: lo que pensás que significa. «Me miró raro» → «piensa que soy un desastre» → ansiedad. La ansiedad suele cometer dos errores: exagera la probabilidad de lo malo y subestima tu capacidad de manejarlo.',
 'El registro de pensamientos sirve para revisar eso con método: qué pasó, qué sentiste, qué pensaste, cuánto lo creés, y algunas preguntas. ¿Qué hay a favor y en contra? ¿Cuántas veces pasó lo que temía? Si pasara, ¿cómo lo manejaría? ¿Qué le diría a un amigo?',
 'El objetivo no es pensar positivo sino más realista. Y no discutir con el pensamiento hasta ganarle: eso se vuelve otra forma de preocuparse. Practicalo cuando estás en 4 o 5 de 10, no en 9.'
],'Un registro hoy, con la preocupación más fuerte del día.','pensamientos','Ir a Pensamientos');
lesson('l13',4,'La incertidumbre',2,[
 'Mucha preocupación tiene un motor: no tolerar no saber. Por eso releés el mail tres veces, chequeás, preguntás «¿está bien, no?», googleás síntomas o planificás todo al detalle. Da alivio unos minutos y alimenta la próxima duda.',
 'Lo que funciona es lo contrario: hacer a propósito cosas chicas con un poco de incertidumbre y ver qué pasa. Mandar un mail sin releerlo tanto. Elegir dónde comer sin leer reseñas. Delegar algo chico sin revisarlo. Antes anotás qué temés y cuánto lo creés; después, qué pasó y cómo lo manejaste.',
 'El objetivo no es tener la certeza de que todo va a salir bien: es aprender que la duda se tolera.'
],'Elegí un experimento chico para esta semana y anotá la predicción.','pensamientos','Ir a Pensamientos');
lesson('l14',4,'Preocupación útil e inútil',3,[
 'Hay dos tipos de preocupación. La útil es sobre algo actual y concreto sobre lo que podés hacer algo ahora: ahí sirve resolver (definir el problema, pensar opciones, elegir una suficientemente buena, fijar el primer paso con día y hora). La inútil es el «¿y si…?» lejano o fuera de tu control: ahí resolver no sirve y se vuelve rumiación con planilla.',
 'Dos herramientas. El diario de «¿se cumplió?»: a la noche anotás qué te preocupó y después revisás si pasó. En un estudio, el 91 % de las preocupaciones no se cumplió.',
 'Y la ventana de preocupación: un rato fijo a la tarde para repasar la lista. Cuando aparece algo fuera de hora, lo anotás y te decís «después». Sirve sobre todo para descubrir que la preocupación se puede postergar.'
],'Esta noche, anotá una preocupación en el diario de «¿se cumplió?».','pensamientos','Ir a Pensamientos');
lesson('l15',5,'Tomar distancia de los pensamientos',3,[
 'Hay pensamientos que no conviene discutir: aparecen solos, se repiten y no se resuelven. Con esos sirve otra cosa: tomar distancia.',
 'Algunas formas: decir «estoy teniendo el pensamiento de que…» en vez del pensamiento a secas. Ponerle nombre a la historia: «ahí viene la de siempre, la de que se va a notar». Imaginar que los pensamientos pasan como autos por la calle: los ves pasar, no te subís.',
 'Con las sensaciones, en vez de pelearlas: notá dónde están, describilas con curiosidad (calor en la cara, nudo en el pecho) y hacé lugar para que estén mientras seguís con lo tuyo.',
 'Ojo con una trampa: aceptar «para que se vaya» es control con otro nombre. La idea es dejar que esté y moverte hacia lo que te importa igual.'
],'Tres veces hoy, cuando aparezca una preocupación, decí «estoy teniendo el pensamiento de que…».','pensamientos','Ir a Pensamientos');
lesson('l16',5,'La atención: adentro y afuera',3,[
 'Cuando estás ansioso en una situación social, la atención se da vuelta hacia adentro: «¿se me nota?, ¿estoy transpirando?, ¿qué cara pongo?». Eso tiene tres efectos: sentís todo más fuerte, te armás una imagen de vos peor que la real, y te perdés lo que pasa afuera, incluida la prueba de que nadie te está mirando así.',
 'En la terapia con más evidencia para la ansiedad social, el cambio que mejor predijo la mejoría fue justamente ese: llevar la atención afuera, a la otra persona y a la charla.',
 'Se entrena primero sin presión: unos minutos atendiendo a sonidos, después a colores y texturas, después a alguien que habla. Y después en charlas: escuchar lo que dice, mirar su cara, interesarte por el tema. No es distraerte para no estar: es estar más presente.'
],'Hacé el ejercicio de atención afuera. En la próxima charla, anotá qué porcentaje de tu atención estuvo en vos.','social','Ir a Social');
lesson('l17',6,'Las muletas',3,[
 'Las muletas (los especialistas les dicen conductas de seguridad) son lo que hacés para que no pase lo que temés: ensayar lo que vas a decir, hablar poco, no mirar a los ojos, agarrar fuerte el vaso, ropa para tapar la transpiración, brazos pegados, tomar alcohol antes, irte rápido.',
 'Tienen tres problemas: no te dejan descubrir que lo temido no pasaba («me salvé porque me cuidé»), aumentan la atención en vos y a veces provocan lo que temés (agarrar fuerte el vaso hace temblar la mano; tensar todo hace transpirar más). Además, cuando la gente las suelta, los demás reaccionan mejor: se te ve más cercano.',
 'Un experimento clásico: dos charlas cortas con la misma persona, una con tus muletas y mirándote por dentro, otra sin muletas y mirando afuera. Después comparás cómo te sentiste y cómo creés que saliste.'
],'Hacé la lista de tus muletas en un círculo o en la escalera.','social','Ir a Social');
lesson('l18',6,'La escalera',3,[
 'La escalera es una lista de 10 a 15 situaciones que evitás o sufrís, ordenadas de menos a más difícil. Para cada una anotás qué temés que pase (de forma que se pueda comprobar), cuánto lo creés y qué muletas vas a soltar.',
 'Lo que se sabe hoy: no hace falta esperar a que baje la ansiedad para terminar. La práctica dura lo necesario para poner a prueba la predicción. Lo que importa es comprobar si lo temido pasó, no sentirte tranquilo.',
 'Cómo usarla: 3 a 5 prácticas por semana. Repetí cada escalón con personas y lugares distintos, mezclá el orden y subí cuando la creencia bajó bastante, aunque la ansiedad siga. Antes de entrar, no te calmes con frases tipo «seguro que no pasa nada». Al terminar, tres preguntas: ¿pasó lo que temía? ¿cómo lo sé? ¿qué aprendí?'
],'Revisá la escalera de ejemplo, adaptala y planeá el primer escalón.','social','Ir a Social');
lesson('l19',6,'La autopsia',2,[
 'Después de una situación social es muy común repasar todo buscando errores: lo que dijiste, cómo te viste, si se notó. Se siente útil, como aprender de los errores. Pero los estudios muestran que hace recordar la situación peor de lo que fue y prepara la ansiedad para la próxima.',
 'Qué hacer: cuando aparezca, nombrala («esto es la autopsia») y volvé a lo que estabas haciendo. Si cuesta, anotá la duda y convertila en un experimento («¿cómo lo puedo comprobar?»). Y no preguntes a otros si quedaste mal: es otra muleta.'
],'La próxima vez que aparezca, nombrala y volvé a lo tuyo.');
lesson('l20',7,'Hacerte amigo de las sensaciones',3,[
 'Si el problema es el miedo a una sensación (transpirar, el pulso, el calor), lo que más ayuda es provocarla a propósito, en un lugar seguro, y quedarte con ella sin hacer nada para frenarla. Se llama exposición a las sensaciones y es parte de los tratamientos con más evidencia.',
 'Ejemplos: subir escaleras rápido o saltar un minuto (pulso, calor, transpiración); abrigarte de más un rato en un lugar cálido o tomar algo caliente (calor, transpiración). Repetís 3 a 5 veces seguidas, anotando cuánta ansiedad da y qué tan parecido es a lo real.',
 'El ejercicio físico hace lo mismo de forma natural: en un estudio, dos semanas de ejercicio bajaron mucho el miedo a las sensaciones del cuerpo.',
 'Cuidado: si tenés un problema de corazón, asma, presión alta no controlada, o tenés dudas, consultalo antes.'
],'Hacé un ejercicio de sensaciones hoy.','sensaciones','Ir a Sensaciones');
lesson('l21',7,'Relajarte en 20 segundos, en la vida real',2,[
 'A esta altura la relajación ya tendría que salirte en poco tiempo: tres respiraciones lentas, la palabra señal al exhalar y soltar mandíbula, hombros y manos. Ahora toca usarla en el día, muchas veces, temprano, ante las primeras señales.',
 'Hay una versión todavía más útil: relajar lo que no necesitás mientras hacés otra cosa. Escribir en la compu con los hombros sueltos. Hablar con la mandíbula floja. Manejar sin apretar el volante.',
 'Una sola condición: que sea para seguir haciendo lo que hacés, no para escapar ni para que «no se note». La pregunta para chequearte: ¿lo hago para estar mejor o para que no pase algo que temo?'
],'15 relajaciones rápidas hoy, atadas a algo que hacés seguido (agarrar el celular, abrir un mail).','relajar','Ir a Relajar');
lesson('l22',8,'Dormir mejor',3,[
 'Dormir mal sube la ansiedad y la ansiedad hace dormir mal. Lo que más funciona para el insomnio es la terapia cognitivo-conductual para el insomnio, no la «higiene del sueño» sola.',
 'Lo central: levantarte siempre a la misma hora, también el fin de semana. Acostarte solo con sueño, no con cansancio. Si no te dormís en unos 20 minutos, levantarte a otro lugar con luz baja y volver cuando tengas sueño. La cama, solo para dormir. Y 30 a 60 minutos antes, bajar: sin trabajo ni pantallas que activan.',
 'Para la cabeza que no para a la noche: a la tarde, 15 minutos para anotar las preocupaciones y el próximo paso de cada una, y cerrar el cuaderno.',
 'Si roncás fuerte, alguien te vio dejar de respirar dormido o te dormís de día sin querer, consultá: puede ser apnea, que también se asocia con bruxismo y dolor de cabeza.'
],'Fijá una hora de levantarte para esta semana y respetala.');
lesson('l23',8,'Café, alcohol y movimiento',2,[
 '<strong>Café y mate.</strong> Por encima de unos 400 mg de cafeína por día sube la ansiedad, y a la tarde roba sueño sin que lo notes. Mantenelo moderado y parejo, nada después de primera hora de la tarde, y si lo bajás, de a poco: la abstinencia da dolor de cabeza y se confunde con ansiedad.',
 '<strong>Alcohol.</strong> Baja la ansiedad un rato y la sube cuando se va, corta el sueño y se asocia con bruxismo. Usado para aguantar situaciones sociales, se vuelve una muleta.',
 '<strong>Movimiento.</strong> El ejercicio baja la ansiedad de forma mediana, más con más intensidad, y ayuda con el dolor de cabeza. De 3 a 5 veces por semana, 30 a 45 minutos, más dos días de fuerza (pueden ser los del cuello).'
],'Dos semanas con café parejo y nada a la tarde. Mirá qué cambia en el diario de dolor de cabeza.');
lesson('l24',8,'Sostenerlo',3,[
 'La ansiedad no se va para siempre: se vuelve más chica y más manejable. Va a haber semanas peores (estrés, poco sueño, una mala experiencia). Una recaída no es volver a cero: es una señal para volver a lo que funcionó.',
 'Armá tu plan: cuáles son tus señales tempranas (mandíbula, cuello, sueño, evitar cosas), qué práctica te sirvió más y qué vas a hacer cuando aparezcan.',
 'Cuándo pedir ayuda: si la escala de ansiedad sigue en 10 o más después de estas semanas, si la ansiedad te hace dejar cosas importantes, si hay ataques de pánico o necesitás alcohol o pastillas para aguantar, o si los dolores de cabeza son frecuentes. La terapia cognitivo-conductual con un psicólogo es lo que más evidencia tiene; el neurólogo para los dolores de cabeza, el dentista para el bruxismo y el kinesiólogo para el cuello.'
],'Escribí tu plan de recaídas abajo y repetí las mediciones.');

function showStep(){
  var s = P.o.steps[P.i];
  P.stepStart = Date.now(); P.phase = -1; P.cycleStart = Date.now();
  document.getElementById('pTitle').textContent = s.title;
  document.getElementById('pText').textContent = s.text;
  var hasB = !!s.breath;
  document.getElementById('pOrbW').hidden = !hasB;
  P.extra = 0;
  if(!hasB){ var au = speak(s.title + '. ' + s.text);
    if(au && s.tag !== 'tensá') au.onloadedmetadata = function(){ if(P && P.o.steps[P.i] === s && isFinite(au.duration)) P.extra = Math.max(0, au.duration + .8 - s.secs); }; }

}
function tick(){
  if(!P || P.paused) return;
  var s = P.o.steps[P.i];
  var el = (Date.now() - P.stepStart) / 1000, dur = s.secs + (P.extra || 0);
  var left = Math.max(0, Math.ceil(dur - el));
  var tEl = document.getElementById('pTime'); if(tEl) tEl.textContent = fmtSecs(left);
  var bar = document.getElementById('pBar'); if(bar) bar.style.width = Math.min(100, ((P.done + Math.min(el, s.secs)) / P.total) * 100) + '%';
  if(s.breath){
    var pat = PATTERNS[s.breath]; var cyc = pat.phases.reduce(function(a, p){ return a + p[1]; }, 0);
    var t = ((Date.now() - P.cycleStart) / 1000) % cyc; var acc = 0, idx = 0;
    for(var k = 0; k < pat.phases.length; k++){ if(t < acc + pat.phases[k][1]){ idx = k; break; } acc += pat.phases[k][1]; }
    if(idx !== P.phase){
      P.phase = idx; var ph = pat.phases[idx];
      var orb = document.getElementById('pOrb');
      if(orb){ orb.style.transition = reduceMotion ? 'none' : 'transform ' + ph[1] + 's ease-in-out'; orb.style.transform = 'scale(' + ph[2] + ')'; }
      var lab = document.getElementById('pOrbL'); if(lab) lab.textContent = ph[0];
      bowl(idx === 0 ? 'in' : (idx === pat.phases.length - 1 ? 'out' : 'hold'), ph[1]);
      speak(ph[0].toLowerCase(), true);
    }
  }
  if(el >= dur){ P.done += s.secs; nextStep(); }
}
function fmtSecs(s){ var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }

  if(P.o.rateBefore){ renderRate('after'); } else { endPlayer(null); }
}
function endPlayer(after){

V.mandibula = function(){
  var wk = lastDays(state.checks, 7);

  s += '<div class="card"><p class="eyebrow">Chequeo de ahora</p><p class="h3">¿Cómo estaba tu mandíbula recién?</p>' + jawBtns() + '<p class="small muted">Anotás y volvés a la posición de reposo. Detectarlo es el ejercicio: no te retes.</p></div>';
  s += '<div class="card"><p class="eyebrow">Últimos 7 días</p>' + (pct === null ? '<p class="small muted">Todavía no hay chequeos.</p>' :
    '<p class="stat">' + pct + ' %</p><p class="small muted">de ' + wk.length + ' chequeos con la mandíbula no relajada. Como referencia, en gente joven sin dolor ronda el 25 %; con dolor de mandíbula, el 60 %. No apuntes a cero.</p>') + '</div>';
  var al = state.alarms && state.alarms.d === ymd() ? state.alarms.times : null;
  if(!al){ al = randomTimes(); state.alarms = { d:ymd(), times:al }; save(); }
  s += '<div class="card"><p class="eyebrow">Alarmas de hoy</p><p class="small">Creá estas alarmas en el reloj del celular con la etiqueta «Mandíbula». Que varíen cada día ayuda a que no te acostumbres. Las primeras 4 semanas, 8 a 10 por día; después, pegatinas y chequear al cambiar de tarea.</p><p class="h3 tnum">' + al.join(' · ') + '</p><button class="btn" data-act="reroll">Sortear otros horarios</button></div>';
  s += '<details class="acc"><summary>Si te duele la mandíbula</summary><div><ul class="dots"><li>Calor húmedo 15 a 20 minutos, dos veces por día, o frío envuelto 5 a 10 minutos. Probá tres días cada uno.</li><li>Automasaje de sien y mejilla, un minuto por músculo, tres veces por día.</li><li>Ejercicio de coordinación: lengua enroscada hacia atrás en el paladar, abrir y cerrar lento en 5 o 6 segundos, 20 veces.</li><li>Comida blanda solo durante la crisis. Evitá chicle, morder lapiceras o uñas.</li><li>Menos café y nada de alcohol a la noche por dos o tres semanas, y mirá si cambia.</li></ul></div></details>';
  s += '<details class="acc"><summary>Cuándo ir al dentista</summary><div><ul class="dots"><li>Desgaste o dientes que se astillan, arreglos que se caen.</li><li>Dolor de mandíbula, sien o delante del oído una vez por semana o más; dolor al abrir o masticar; mandíbula que se traba.</li><li>Dolor de cabeza frecuente al despertar o mandíbula cansada a la mañana.</li><li>La placa de descarga protege los dientes de noche, no cura el bruxismo: la indica el dentista.</li><li>Si de golpe no podés abrir o cerrar la boca, consultá urgente.</li></ul></div></details>';
  return s;
};
function randomTimes(){ var out = [], tries = 0; while(out.length < 9 && tries < 500){ tries++; var m = 9 * 60 + Math.floor(Math.random() * (11 * 60)); if(out.every(function(x){ return Math.abs(x - m) >= 45; })) out.push(m); } out.sort(function(a, b){ return a - b; }); return out.map(function(m){ var h = Math.floor(m / 60), mm = m % 60; return h + ':' + (mm < 10 ? '0' : '') + mm; }); }

  s += '<details class="acc"><summary>Postura y pausas</summary><div><p>La postura perfecta no existe y la relación entre cómo te sentás y el dolor es débil. Lo que más ayuda es no quedarte quieto: una pausa de 1 o 2 minutos cada 45 a 60 minutos de pantalla. Poné la pantalla más o menos a la altura de los ojos y los hombros sueltos, sin vivir corrigiéndote.</p><p>Calor, masaje y automasaje alivian un rato, pero no cambian el curso: usalos para poder moverte.</p></div></details>';
  s += '<details class="acc"><summary>Cuándo no es para hacer solo</summary><div><ul class="dots"><li><b>Guardia ya:</b> dolor de cuello o cabeza con mareo fuerte, visión doble, dificultad para hablar o tragar, inestabilidad, párpado caído; dolor de cabeza nuevo y brutal; golpe fuerte; dolor de pecho.</li><li><b>Médico en días:</b> manos torpes o dormidas en las dos manos; dolor que baja por el brazo con hormigueo o debilidad; fiebre o pérdida de peso sin explicación.</li><li><b>Kinesiólogo:</b> si en 4 a 6 semanas no mejora o si un ejercicio te deja peor más de un día.</li></ul></div></details>';

  var top = Object.keys(c).filter(function(k){ return ['comida','mandibula','pantalla','alcohol'].indexOf(k) >= 0 && c[k] > 0; }).sort(function(a, b){ return c[b] - c[a]; });

  if(sl.length) out += '<li>En ' + lowSleep + ' de ' + sl.length + ' habías dormido menos de 6 horas y media.</li>';
  top.forEach(function(k){ out += '<li>' + c[k] + ' con «' + HTAG[k] + '».</li>'; });

}

V.pensamientos = function(){

  s += '<details class="acc"><summary>Registro de pensamientos</summary><div><p class="small muted">Para revisar un pensamiento que te angustia. Lo realista, no lo positivo.</p><form class="form" data-form="thought">' +
    '<label>Qué pasó<textarea name="sit" placeholder="Ej.: el jefe me pidió hablar mañana a las 10"></textarea></label>' +

    '<div class="card soft small"><b>Preguntas</b><ul class="dots"><li>¿Qué hay a favor y en contra?</li><li>¿Qué probabilidad real tiene? ¿Cuántas veces pasó lo que temía?</li><li>Si pasara, ¿qué tan grave sería y cómo lo manejaría?</li><li>¿Qué le diría a un amigo en mi lugar?</li></ul></div>' +
    '<label>Una forma más equilibrada de verlo<textarea name="alt"></textarea></label>' +

  s += '<details class="acc"><summary>¿Se cumplió? (diario de preocupaciones)</summary><div><p class="small muted">A la noche anotás qué te preocupa y qué temés que pase. Días después, marcás qué pasó. En un estudio, el 91 % no se cumplió.</p><form class="form" data-form="worry">' +
    '<label>Qué me preocupa<input type="text" name="w" required></label><label>Qué temo que pase<input type="text" name="fear"></label><button class="btn primary">Anotar</button></form>' + listWorries() + '</div></details>';
  s += '<details class="acc"><summary>Experimentos con la incertidumbre</summary><div><p class="small muted">Hacé a propósito algo chico sin certeza total y comprobá qué pasa. Ideas: mandar un mail sin releerlo tres veces, elegir dónde comer sin leer reseñas, delegar algo sin revisarlo, no chequear el celular un rato.</p><form class="form" data-form="uncert">' +
    '<label>Qué voy a hacer<input type="text" name="what" required></label><label>Qué temo que pase<input type="text" name="fear"></label><label>Cuánto lo creo (0 a 100 %)<input type="number" name="cre" min="0" max="100" inputmode="numeric"></label><button class="btn primary">Planear</button></form>' + listUncert() + '</div></details>';
  s += '<details class="acc"><summary>¿Útil o inútil? Resolver</summary><div><p class="small">¿Es algo actual, concreto y sobre lo que puedo hacer algo ahora? Si <b>sí</b>, resolvelo en 5 pasos. Si es un «¿y si…?» lejano o fuera de tu control, no lo resuelvas: anotalo en «¿Se cumplió?» o tomá distancia.</p><form class="form" data-form="problem">' +
    '<label>1. El problema, concreto<input type="text" name="p" required></label><label>2. Opciones, sin juzgar<textarea name="ops"></textarea></label><label>3. La suficientemente buena<input type="text" name="elegida"></label><label>4. Primer paso, con día y hora<input type="text" name="paso"></label><button class="btn primary">Guardar</button></form>' + listProblems() + '</div></details>';
  s += '<details class="acc"><summary>Tomar distancia</summary><div><ul class="dots"><li>Anteponé «estoy teniendo el pensamiento de que…».</li><li>Ponele nombre a la historia: «ahí viene la de siempre».</li><li>Imaginá que los pensamientos pasan como autos: los ves pasar, no te subís.</li><li>Con las sensaciones: dónde están, cómo son, y hacé lugar para que estén mientras seguís.</li></ul><p class="small muted">Aceptar «para que se vaya» es control con otro nombre. Dejalo estar y seguí con lo que te importa.</p></div></details>';
  s += '<details class="acc"><summary>Lo que conviene no hacer</summary><div><ul class="dots"><li>Decirte «no pienses en eso»: vuelve con más fuerza.</li><li>Pedir que te tranquilicen o googlear síntomas: alivia minutos y trae la próxima duda.</li><li>Discutir con el pensamiento hasta ganarle.</li><li>Evitar decisiones o situaciones.</li></ul></div></details>';
  return s;
};

V.social = function(){
  var s = '<div class="card soft"><p>Lo que más funciona para la ansiedad social: <b>soltar las muletas</b>, <b>poner la atención afuera</b> y <b>hacer experimentos de a poco</b>, anotando qué temías y qué pasó.</p><p class="h3">Por dónde empezar</p><ol class="dots small"><li>Leé la lección «Las muletas».</li><li>Unos días, hacé el ejercicio de atención afuera.</li><li>Elegí el escalón más fácil de tu escalera y tocá «Practicar»: anotás qué temés.</li><li>Hacelo sin muletas. Después anotás qué pasó.</li><li>Repetí 3 a 5 veces por semana y subí de a poco.</li></ol></div>';
  s += '<details class="acc"><summary>Atención afuera: el ejercicio</summary><div><ol class="dots"><li>1 minuto: solo los sonidos que hay, uno por uno.</li><li>1 minuto: colores, formas y texturas a tu alrededor.</li><li>1 minuto: música o una voz (un podcast, alguien que habla).</li><li>En la próxima charla: escuchá lo que dice, mirá su cara, interesate por el tema.</li></ol><p class="small muted">No es distraerte para no estar: es estar más presente. Después de cada situación, anotá qué porcentaje de tu atención estuvo en vos.</p></div></details>';

    return '<li class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><p class="h3" style="flex:1;min-width:0">' + esc(x.sit) + '</p><span class="chip">' + esc(x.suds) + '</span></div>' +

      (done.length ? '<p class="small"><span class="chip ok">hecho ' + done.length + (done.length === 1 ? ' vez' : ' veces') + '</span> creencia última: ' + esc(last.cre2) + ' %</p>' : '') +
      '<div class="row"><button class="btn small primary" data-act="planexp" data-id="' + x.id + '">Practicar</button><button class="btn small" data-act="editstep" data-id="' + x.id + '">Editar</button><button class="btn ghost small" data-act="del" data-k="ladder" data-id="' + x.id + '">Borrar</button></div></li>'; }).join('') + '</ul>';
  s += '<div class="card" id="stepForm">' + stepForm(null) + '</div>';

  var open = state.experiments.filter(function(e){ return !e.res; });
  if(open.length) s += '<div class="card"><p class="eyebrow">Planeados</p>' + open.map(function(e){ return '<div class="item"><p><b>' + esc(e.sit) + '</b></p><p class="small">Temo: ' + esc(e.pred) + ' (' + esc(e.cre1) + ' %) · Suelto: ' + esc(e.mul) + '</p>' + expDoneForm(e) + '</div>'; }).join('') + '</div>';

  [min, (min + max) / 2, max].forEach(function(v){ g += '<line class="gd" x1="' + l + '" x2="' + (W - r) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/><text x="' + (l - 4) + '" y="' + (ys(v) + 3) + '" text-anchor="end">' + Math.round(v) + '</text>'; });
  refs.forEach(function(rf){ g += '<line class="rf" x1="' + l + '" x2="' + (W - r) + '" y1="' + ys(rf.y) + '" y2="' + ys(rf.y) + '"/><text x="' + (W - r - 2) + '" y="' + (ys(rf.y) - 3) + '" text-anchor="end">' + esc(rf.l) + '</text>'; });
  var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(p.y).toFixed(1); }).join(' ');
  if(pts.length > 1) g += '<path class="ar" d="' + d + ' L' + xs(pts.length - 1).toFixed(1) + ' ' + ys(min) + ' L' + xs(0).toFixed(1) + ' ' + ys(min) + ' Z"/><path class="ln" d="' + d + '"/>';
  g += '<circle class="pt" cx="' + xs(pts.length - 1) + '" cy="' + ys(pts[pts.length - 1].y) + '" r="3.5"/>';
  g += '<text x="' + l + '" y="' + (H - 5) + '">' + esc(fmtDate(pts[0].t)) + '</text>';
  if(pts.length > 1) g += '<text x="' + (W - r) + '" y="' + (H - 5) + '" text-anchor="end">' + esc(fmtDate(pts[pts.length - 1].t)) + '</text>';
  return g + '</svg>';
}

['r16','r7','r4','senal','rapida','diferencial'].forEach(function(k){ A['relax-' + k] = function(){ startPlayer({ title:'Relajación · ' + RELAX[k].name, steps:RELAX[k].steps(), type:'relax-' + k }); }; });

document.addEventListener('click', function(e){

document.addEventListener('submit', function(e){

});
document.addEventListener('input', function(e){
  var el = e.target;
  if(el.dataset && el.dataset.out){ var o = document.getElementById(el.dataset.out); if(o) o.textContent = el.value; }
  if(el.dataset && el.dataset.save === 'relapse'){ state.relapse = el.value; save(); }
  if(el.dataset && el.dataset.set === 'palabra'){ state.settings.palabra = el.value.trim() || 'soltá'; save(); }
  if(el.dataset && el.dataset.num){ var v = parseInt(el.value, 10); if(v > 0){ state[el.dataset.num] = v; save(); } }
  if(el.dataset && el.dataset.set === 'volFondo'){ state.settings.volFondo = parseFloat(el.value); save(); setBgVol(); }
});
document.addEventListener('change', function(e){
  var el = e.target;
  if(el.dataset && el.dataset.set === 'guia'){ state.settings.guia = el.value; save(); A.testguia(); }
  if(el.dataset && el.dataset.set === 'fondo'){ state.settings.fondo = el.value; save(); if(AU.bg) startBg(); }
  if(el.dataset && el.dataset.num){ render(); }
});
try{ if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged = function(){ VOICE = null; }; }catch(e){}
window.addEventListener('hashchange', function(){ if(P) closePlayer(); render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden && P && P.timer && navigator.wakeLock && !wake) lockScreen(); });

window.__calmaTextos = function(){
  var out = {}, add = function(t){ out[normT(t)] = 1; };
  var addS = function(steps){ steps.forEach(function(st){ if(st.breath) PATTERNS[st.breath].phases.forEach(function(ph){ add(ph[0].toLowerCase()); }); else add(st.title + '. ' + st.text); }); };
  var keep = state.settings.palabra; state.settings.palabra = 'soltá';
  addS(acceleratedSteps()); addS(pauseSteps()); addS(neck2Steps()); addS(neckFullSteps());
  Object.keys(RELAX).forEach(function(k){ addS(RELAX[k].steps()); });
  SENS.forEach(function(x){ addS(sensSteps(x)); });
  Object.keys(PATTERNS).forEach(function(k){ PATTERNS[k].phases.forEach(function(ph){ add(ph[0].toLowerCase()); }); });
  state.settings.palabra = keep;
  return Object.keys(out);
};

render();
